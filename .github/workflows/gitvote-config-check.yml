---
# .github/workflows/gitvote-config-check.yml
#
# Fails if .gitvote.yml was hand-edited or if tsc.yml changed without
# regenerating. Keeps the roster as the single source of truth.

name: Check GitVote config

on:
  pull_request:
    paths:
      - tsc.yml
      - .gitvote.yml
      - generate_gitvote_config.py
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Verify .gitvote.yml matches tsc.yml
        run: python3 generate_gitvote_config.py --check

      - name: Show voting command reference
        if: always()
        run: |
          echo '## GitVote command reference' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          python3 generate_gitvote_config.py --table >> "$GITHUB_STEP_SUMMARY"
